<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ronde Suisse</title>
  <meta name="description" content="Gestion de tournoi de draft Magic en rondes suisses (BO3) avec timers.">
  <meta name="theme-color" content="#7a3cc2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ronde Suisse">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Ronde Suisse</h1>
      <span id="t-title" class="t-title"></span>
    </div>
    <nav class="tools">
      <button class="btn btn-sm btn-primary" id="install-btn" hidden>📲 Installer</button>
      <button class="btn btn-sm" data-action="export">Exporter</button>
      <button class="btn btn-sm" data-action="import">Importer</button>
      <button class="btn btn-sm" data-action="reset">Nouveau tournoi</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </nav>
  </header>
  <ol id="stepper" class="stepper"></ol>
  <main id="app" class="container"></main>

  <script src="js/swiss.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
